[project]
name = "arsia-protocol"
version = "1.0.1"
description = "ARSIA Protocol SDK — EdDSA signing, message types, compliance profiles for autonomous AI agent infrastructure"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.12"
authors = [
    {name = "Kirk Patrick", email = "kirk@arsialabs.ai"},
    {name = "Greici Savoldi", email = "greici@arsialabs.ai"},
]
keywords = [
    "arsia",
    "arsia-protocol",
    "agents",
    "ai-agents",
    "autonomous-agents",
    "ed25519",
    "eddsa",
    "compliance",
    "eu-ai-act",
    "gdpr",
    "mifid",
    "dora",
    "audit",
    "jcs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.21.0",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
    "types-jsonschema>=4.21.0",
    "build>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
arsia = "arsia_protocol.__main__:cli"

[project.urls]
Homepage = "https://arsiaprotocol.org"
Documentation = "https://arsiaprotocol.org"
Repository = "https://github.com/arsialabs/arsia-protocol-sdk"
Specification = "https://github.com/arsialabs/arsia-protocol"
Changelog = "https://github.com/arsialabs/arsia-protocol-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/arsialabs/arsia-protocol-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/hatch_build.py",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.hypothesis",
    "**/.coverage",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist.force-include]
"src/arsia_protocol/_data" = "src/arsia_protocol/_data"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/arsia_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"src/arsia_protocol/_data" = "arsia_protocol/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
