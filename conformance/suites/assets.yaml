  # ---- §3.1.1 Metadata included in audit payload_hash (P3.2) ----------
  # NOTE: RTM ASSETS-§3.1.1-40 says metadata is included in payload_hash
  # "when audit_required is true", implying conditional exclusion when false.
  # However, compute_payload_hash always hashes the full payload including
  # metadata — the audit_required conditional is the caller's responsibility
  # (e.g., the gateway decides whether to include metadata before hashing).
  # A counterpart ASSETS-META-HASH-NO-AUDIT case is therefore not applicable
  # at the SDK level; the SDK hashes whatever payload it receives.

  - id: ASSETS-META-HASH-01
    description: "payload_hash SHA-256 includes metadata when audit_required is true"
    category: state
    level: compliance
    spec_ref: "ARSIA-Assets §3.1.1"
    rtm_ids:
      - "ASSETS-§3.1.1-40"
    input:
      operation: compute_payload_hash
      payload:
        type: "arsiaprotocol.assets/transfer-request"
        args:
          amount: "100.00"
          currency_or_unit: "EUR"
          from_agent: "agent:acme.alpha"
          to_agent: "agent:acme.beta"
          asset_type: "currency"
          metadata:
            invoice_id: "INV-001"
            department: "finance"
    expected:
      sha256_hex: "838aa32b394e679f08d9ac233d5a7bca352f6230e0e955209867c07d0ccdd529"

