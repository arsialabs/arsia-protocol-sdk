  # ---- Identity consistency (Identity §1.1) ----------------------------------

  - id: IDENT-CONSISTENCY-ALL-MATCH
    description: "Three-layer identity is consistent when from, kid prefix, and identity_agent_id all match"
    category: validation
    level: core
    spec_ref: "ARSIA-Identity §1.1"
    rtm_ids:
      - "IDENT-§1.1-02"
    input:
      operation: validate_identity_consistency
      from_agent: "agent:acme.billing"
      kid: "agent:acme.billing#key-1"
      identity_agent_id: "agent:acme.billing"
    expected:
      consistent: true

  - id: IDENT-CONSISTENCY-KID-MISMATCH
    description: "Inconsistent kid prefix vs from field is detected"
    category: validation
    level: core
    spec_ref: "ARSIA-Identity §1.1"
    rtm_ids:
      - "IDENT-§1.1-02"
    input:
      operation: validate_identity_consistency
      from_agent: "agent:acme.billing"
      kid: "agent:contoso.crm#key-1"
      identity_agent_id: "agent:acme.billing"
    expected:
      consistent: false
      warning_contains: "kid prefix"
      warning_count: 2

  - id: IDENT-CONSISTENCY-IDENTITY-MISMATCH
    description: "Inconsistent IdentityRecord agent_id vs from field is detected"
    category: validation
    level: core
    spec_ref: "ARSIA-Identity §1.1"
    rtm_ids:
      - "IDENT-§1.1-02"
    input:
