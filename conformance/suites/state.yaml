      error_contains: "residency"

  # ---- §2.3 Binary data must be base64-encoded (P3.2) -----------------

  - id: STATE-BINARY-JSON-01
    description: "non-JSON value (NaN) is rejected — binary data must be base64-encoded"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.3"
    rtm_ids:
      - "STATE-§2.3-02"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      entry:
        key: "agent:acme.alpha/agent/binary.data"
        value: .nan
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "none"
        version: 1
    expected:
      valid: false
      error_contains: "json"

  - id: STATE-BINARY-BASE64-01
    description: "base64-encoded binary value is accepted"
