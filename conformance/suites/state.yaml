# SPDX-License-Identifier: BUSL-1.1
# State primitive — §2 data model, §3 operations (payload shapes),
# §4 retention, §7 audit, §8 capability model. HTTP-/storage-bound
# cases (round-trip GET after SET, version conflict, QUERY filtering,
# SNAPSHOT listing, DELETE->404) are marked skip_until: http-harness.
name: state
description: 'State primitive: entry validation, key grammar, retention floor, capability matrix, payload_hash, audit builder, request-arg shapes for SET/QUERY/SNAPSHOT/PURGE/GRANT/REVOKE.'
level: compliance
cases:

  # ---- §2.1.1 Key grammar --------------------------------------------

  - id: STATE-KEY-01
    description: "well-formed agent-scoped key is accepted"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.1"
    rtm_ids:
      - "STATE-§10.2-01"
    input:
      operation: validate_state_key
      key: "agent:acme.alpha/agent/user.profile"
      expected_owner: "agent:acme.alpha"
      expected_scope: "agent"
    expected:
      valid: true

  - id: STATE-KEY-02
    description: "key missing scope segment is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.1"
    rtm_ids:
      - "STATE-§10.2-01"
    input:
      operation: validate_state_key
      key: "agent:acme.alpha/user.profile"
    expected:
      valid: false

  - id: STATE-KEY-03
    description: "unknown scope is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.1"
    rtm_ids:
      - "STATE-§10.2-01"
    input:
      operation: validate_state_key
      key: "agent:acme.alpha/tenant/user.profile"
    expected:
      valid: false
      error_contains: "scope"

  - id: STATE-KEY-04
    description: "reserved arsiaprotocol.* prefix is rejected without opt-in"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.1"
    rtm_ids:
      - "STATE-§2.2-07"
      - "STATE-§2.2-08"
    input:
      operation: validate_state_key
      key: "agent:acme.alpha/agent/arsiaprotocol.system"
    expected:
      valid: false
      error_contains: "reserved"

  - id: STATE-KEY-05
    description: "key exceeding 512 chars is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.1"
    rtm_ids:
      - "STATE-§2.1.1-07"
    input:
      operation: validate_state_key
      key: "agent:acme."
    expected:
      valid: false
      error_contains: "length"

  # ---- §2.1.2 Value size limit (1 MiB) -------------------------------

  - id: STATE-SIZE-01
    description: "small scalar value passes 1 MiB check"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.2"
    rtm_ids:
      - "STATE-§2.1.2-05"
    input:
      operation: enforce_value_size
      value: {k: "small"}
    expected:
      valid: true

  - id: STATE-SIZE-02
    description: "null value passes"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.2"
    rtm_ids:
      - "STATE-§2.1.2-05"
    input:
      operation: enforce_value_size
      value: null
    expected:
      valid: true

  # ---- §4.1.1 Effective retention = max(profile, entry) --------------

  - id: STATE-RETENTION-01
    description: "EU-AI-ACT-HIGH-RISK (180d) with no entry override yields 180"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §4.1.1"
    rtm_ids:
      - "STATE-§4.1-01"
      - "STATE-§4.1.2-02"
    input:
      operation: effective_retention
      profile_name: "EU-AI-ACT-HIGH-RISK"
      entry_retention_days: null
    expected:
      retention_days: 180

  - id: STATE-RETENTION-02
    description: "entry retention extends profile minimum"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §4.1.1"
    rtm_ids:
      - "STATE-§4.1-01"
      - "STATE-§5.4-10"
    input:
      operation: effective_retention
      profile_name: "EU-AI-ACT-HIGH-RISK"
      entry_retention_days: 2555
    expected:
      retention_days: 2555

  - id: STATE-RETENTION-03
    description: "entry retention shorter than profile does not reduce it"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §4.1.1"
    rtm_ids:
      - "STATE-§4.1.1-02"
      - "STATE-§2.1.8-03"
    input:
      operation: effective_retention
      profile_name: "MIFID-II"
      entry_retention_days: 30
    expected:
      retention_days: 1827

  - id: STATE-RETENTION-04
    description: "GDPR-STANDARD has no mandatory minimum; returns null"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §6"
    rtm_ids:
      - "STATE-§4.1-01"
    input:
      operation: effective_retention
      profile_name: "GDPR-STANDARD"
      entry_retention_days: null
    expected:
      retention_days: null

  # ---- §8.2 Capability matrix ----------------------------------------

  - id: STATE-CAP-01
    description: "GET maps to arsiaprotocol.state.read"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.2-01"
      - "STATE-§3.1.1-02"
    input:
      operation: required_capability
      operation_name: "GET"
    expected:
      capability: "arsiaprotocol.state.read"

  - id: STATE-CAP-02
    description: "SET maps to arsiaprotocol.state.write"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.2-01"
    input:
      operation: required_capability
      operation_name: "SET"
    expected:
      capability: "arsiaprotocol.state.write"

  - id: STATE-CAP-03
    description: "PURGE requires arsiaprotocol.state.purge"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.2-01"
      - "STATE-§3.2.2-12"
    input:
      operation: required_capability
      operation_name: "PURGE"
    expected:
      capability: "arsiaprotocol.state.purge"

  - id: STATE-CAP-04
    description: "SNAPSHOT requires arsiaprotocol.state.snapshot"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.2-01"
    input:
      operation: required_capability
      operation_name: "SNAPSHOT"
    expected:
      capability: "arsiaprotocol.state.snapshot"

  - id: STATE-WILDCARD-01
    description: "state.* covers read"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.1-01"
    input:
      operation: wildcard_covers
      wildcard: "arsiaprotocol.state.*"
      capability: "arsiaprotocol.state.read"
    expected:
      covered: true

  - id: STATE-WILDCARD-02
    description: "state.* excludes purge"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.1-01"
      - "STATE-§3.2.2-11"
    input:
      operation: wildcard_covers
      wildcard: "arsiaprotocol.state.*"
      capability: "arsiaprotocol.state.purge"
    expected:
      covered: false

  - id: STATE-WILDCARD-03
    description: "state.* excludes snapshot"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §8.2"
    rtm_ids:
      - "STATE-§8.2.1-01"
      - "STATE-§3.2.1-12"
    input:
      operation: wildcard_covers
      wildcard: "arsiaprotocol.state.*"
      capability: "arsiaprotocol.state.snapshot"
    expected:
      covered: false

  # ---- §7.1 payload_hash + audit builder -----------------------------

  - id: STATE-HASH-01
    description: "payload_hash equals SHA-256 of canonical payload"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §7.1"
    rtm_ids:
      - "STATE-§7.1-18"
    input:
      operation: compute_payload_hash
      payload:
        type: "arsiaprotocol.state/set"
        args:
          key: "agent:acme.alpha/agent/k"
          value: {n: 1}
    expected:
      sha256_hex: null  # self-computed by the executor

  - id: STATE-HASH-02
    description: "payload_hash is key-order stable"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §7.1"
    rtm_ids:
      - "STATE-§7.1-18"
    input:
      operation: compute_payload_hash
      payload:
        args: {value: {b: 2, a: 1}, key: "agent:acme.alpha/agent/k"}
        type: "arsiaprotocol.state/set"
    expected:
      sha256_hex: null

  - id: STATE-AUDIT-01
    description: "state_set record carries payload_hash and compliance profile"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §7.1"
    rtm_ids:
      - "STATE-§3.1.2-19"
      - "STATE-§7.1-18"
      - "STATE-§7.1-19"
    input:
      operation: build_audit_record
      envelope:
        v: "1.0"
        id: "11111111-1111-4111-9111-111111111111"
        ts: "2026-04-13T12:00:00.000Z"
        from: "agent:acme.alpha"
        to: "agent:acme.beta"
        intent: "request"
        compliance:
          profile: "GDPR-STANDARD"
          legal_basis: "consent"
          data_residency: "PT"
          pii_involved: true
        payload:
          type: "arsiaprotocol.state/set"
          args:
            key: "agent:acme.alpha/agent/user.profile"
            value: {name: "Jane"}
      event_type: "state_set"
      operator_id: "LEI:529900T8BM49AURSDO55"
      effective_retention_days: 90
    expected:
      event_type: "state_set"
      compliance_profile: "GDPR-STANDARD"
      required_keys:
        - record_id
        - message_id
        - payload_hash
        - operator_id
        - compliance_profile
        - data_residency
        - processed_at
        - retained_until

  - id: STATE-AUDIT-02
    description: "state_purge record from PURGE envelope carries no value in payload"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.2.2, §7.1"
    rtm_ids:
      - "STATE-§3.2.2-02"
      - "STATE-§3.2.2-08"
    input:
      operation: build_audit_record
      envelope:
        v: "1.0"
        id: "22222222-2222-4222-9222-222222222222"
        ts: "2026-04-13T12:00:00.000Z"
        from: "agent:compliance.checker"
        to: "agent:acme.store"
        intent: "request"
        compliance:
          profile: "GDPR-STANDARD"
          legal_basis: "legal_obligation"
          pii_involved: true
        payload:
          type: "arsiaprotocol.state/purge"
          args:
            key: "agent:acme.alpha/agent/personal-data"
            reason: "GDPR Art. 17 erasure request"
      event_type: "state_purge"
      operator_id: "LEI:X"
      effective_retention_days: 90
    expected:
      event_type: "state_purge"

  # ---- §3.1.2 SET request-arg shape ----------------------------------

  - id: STATE-SET-01
    description: "build_set_args returns FLAT shape with key/value/scope/pii_classification at top level (no 'entry' wrapper)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.2"
    rtm_ids:
      - "STATE-§3.1.2-01"
      - "STATE-§3.1.2-02"
      - "STATE-§3.1.2-03"
      - "STATE-§3.1.2-04"
    input:
      operation: set_args_shape
      entry:
        key: "agent:acme.alpha/agent/user.profile"
        value: {name: "Jane"}
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "personal"
        version: 1
        data_residency: "PT"
    expected:
      required_keys: [key, value, scope, pii_classification]
      absent_keys: [entry, owner_agent_id, created_at, updated_at, version, deleted]

  - id: STATE-SET-02
    description: "build_set_args with scope='global' is rejected (agents cannot SET global entries)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.2"
    rtm_ids:
      - "STATE-§3.1.2-09"
      - "STATE-§3.1.2-10"
    input:
      operation: set_args_shape
      entry:
        key: "agent:acme.alpha/global/sys.config"
        value: {k: 1}
        owner_agent_id: "agent:acme.alpha"
        scope: "global"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "none"
        version: 1
    expected:
      valid: false

  - id: STATE-SET-03
    description: "build_set_args carries optional expected_version for optimistic concurrency"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.2, §2.4"
    rtm_ids:
      - "STATE-§2.1.12-01"
    input:
      operation: set_args_shape
      entry:
        key: "agent:acme.alpha/agent/counter"
        value: {n: 10}
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "none"
        version: 2
      expected_version: 1
    expected:
      required_keys: [key, value, scope, expected_version]

  # ---- §3.1.4 QUERY request-arg shape --------------------------------

  - id: STATE-QUERY-ARGS-01
    description: "build_query_args uses 'key_prefix' (not 'prefix') per §3.1.4"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.4"
    # TODO: map to RTM — no structural row for QUERY field naming
    input:
      operation: query_args_shape
      scope: "agent"
      key_prefix: "agent:acme.alpha/agent/"
    expected:
      required_keys: [scope, key_prefix]
      absent_keys: [prefix]

  - id: STATE-QUERY-ARGS-02
    description: "build_query_args with no filters returns empty args (scope optional)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.4"
    # TODO: map to RTM — no structural row for QUERY optional fields
    input:
      operation: query_args_shape
    expected:
      absent_keys: [scope, key_prefix, owner_agent_id, pii_classification, limit, offset]

  - id: STATE-QUERY-ARGS-03
    description: "build_query_args supports pii_classification filter per §3.1.4"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.4"
    # TODO: map to RTM — no structural row for QUERY pii_classification filter
    input:
      operation: query_args_shape
      pii_classification: "personal"
    expected:
      required_keys: [pii_classification]

  # ---- §3.2.1 SNAPSHOT request-arg shape -----------------------------

  - id: STATE-SNAPSHOT-ARGS-01
    description: "build_snapshot_args requires as_of per §3.2.1"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.2.1"
    rtm_ids:
      - "STATE-§3.2.1-01"
    input:
      operation: snapshot_args_shape
      as_of: "2026-04-13T12:00:00.000Z"
    expected:
      required_keys: [as_of]
      absent_keys: [filter]

  - id: STATE-SNAPSHOT-ARGS-02
    description: "build_snapshot_args accepts optional filter object (QUERY-shape)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.2.1"
    # TODO: map to RTM — no structural row for SNAPSHOT optional filter
    input:
      operation: snapshot_args_shape
      as_of: "2026-04-13T12:00:00.000Z"
      filter:
        scope: "agent"
        key_prefix: "agent:acme.alpha/agent/"
    expected:
      required_keys: [as_of, filter]

  # ---- §3.2.2 PURGE request-arg shape --------------------------------

  - id: STATE-PURGE-01
    description: "build_purge_args carries key + reason (no subject_agent_id, no value)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.2.2"
    rtm_ids:
      - "STATE-§3.2.2-01"
    input:
      operation: purge_args_shape
      key: "agent:acme.alpha/agent/personal-data"
      reason: "GDPR Art. 17 erasure request"
    expected:
      required_keys: [key, reason]
      absent_keys: [value, subject_agent_id]

  # ---- §3.3.1 GRANT request-arg shape --------------------------------

  - id: STATE-GRANT-01
    description: "build_grant_args has key_pattern + grantee_agent_id + access_level per §3.3.1"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.3.1"
    rtm_ids:
      - "STATE-§3.3.1-01"
      - "STATE-§3.3.1-02"
      - "STATE-§3.3.1-03"
    input:
      operation: grant_args_shape
      key_pattern: "agent:acme.alpha/agent/shared-*"
      grantee_agent_id: "agent:acme.beta"
      access_level: "read"
    expected:
      required_keys: [key_pattern, grantee_agent_id, access_level]
      absent_keys: [key, subject_agent_id, capabilities]

  - id: STATE-GRANT-02
    description: "build_grant_args rejects access_level not in {read, read_write}"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.3.1"
    rtm_ids:
      - "STATE-§3.3.1-03"
    input:
      operation: grant_args_shape
      key_pattern: "agent:acme.alpha/agent/data"
      grantee_agent_id: "agent:acme.beta"
      access_level: "admin"
    expected:
      valid: false

  - id: STATE-GRANT-03
    description: "build_grant_args accepts optional valid_until expiry"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.3.1"
    # TODO: map to RTM — no structural row for GRANT valid_until optionality
    input:
      operation: grant_args_shape
      key_pattern: "agent:acme.alpha/agent/data"
      grantee_agent_id: "agent:acme.beta"
      access_level: "read_write"
      valid_until: "2026-06-24T00:00:00.000Z"
    expected:
      required_keys: [key_pattern, grantee_agent_id, access_level, valid_until]

  # ---- §3.3.2 REVOKE request-arg shape -------------------------------

  - id: STATE-REVOKE-01
    description: "build_revoke_args has only grant_id per §3.3.2"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.3.2"
    rtm_ids:
      - "STATE-§3.3.2-08"
    input:
      operation: revoke_args_shape
      grant_id: "11111111-1111-4111-9111-111111111111"
    expected:
      required_keys: [grant_id]
      absent_keys: [key_pattern, grantee_agent_id, access_level, key]

  # ---- Entry validation: PII + compliance coupling -------------------

  - id: STATE-ENTRY-01
    description: "personal-PII entry with GDPR-STANDARD + consent is valid"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1, §4.2"
    rtm_ids:
      - "STATE-§2.1.10-05"
      - "STATE-§6.1-02"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      envelope_compliance:
        profile: "GDPR-STANDARD"
        legal_basis: "consent"
        data_residency: "PT"
        pii_involved: true
      entry:
        key: "agent:acme.alpha/agent/user.profile"
        value: {name: "Jane"}
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "personal"
        version: 1
        data_residency: "PT"
    expected:
      valid: true

  - id: STATE-ENTRY-02
    description: "personal-PII entry without legal_basis is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §4.2"
    rtm_ids:
      - "STATE-§2.1.10-06"
      - "STATE-§5.2-02"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      envelope_compliance:
        profile: "GDPR-STANDARD"
        data_residency: "PT"
        pii_involved: true
      entry:
        key: "agent:acme.alpha/agent/user.profile"
        value: {name: "Jane"}
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "personal"
        version: 1
        data_residency: "PT"
    expected:
      valid: false
      error_contains: "legal_basis"

  # ---- Storage-dependent cases (skip_until: state-storage) ------

  - id: STATE-RT-01
    description: "SET then GET returns the stored entry (storage round-trip)"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.1, §3.1.2"
    rtm_ids:
      - "STATE-§3.1.1-01"
    skip_until: "state-storage"
    # Requires: arsiactl server with state storage backend.
    # The SDK builds request payloads (build_set_args, build_get_args)
    # but does not store state. This case tests the full SET→GET
    # round-trip which needs a live state store.
    input:
      operation: set_then_get
      key: "agent:external.demo/agent/rt.key"
    expected:
      valid: true

  - id: STATE-VERSION-01
    description: "SET with stale expected_version yields conflict"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.2"
    rtm_ids:
      - "STATE-§2.1.12-02"
    skip_until: "state-storage"
    # Requires: arsiactl server with state storage backend supporting
    # optimistic concurrency (expected_version). The SDK builds the
    # request but the server enforces version conflict detection.
    input:
      operation: version_conflict
      key: "agent:external.demo/agent/v.key"
    expected:
      error_code: "conflict"

  - id: STATE-QUERY-01
    description: "QUERY filters by key_prefix and scope"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.4"
    rtm_ids:
      - "STATE-§3.1.4-09"
    skip_until: "state-storage"
    # Requires: arsiactl server with state storage backend supporting
    # QUERY filtering by key_prefix and scope. The SDK builds query
    # arguments but the server executes the filter.
    input:
      operation: query
      key_prefix: "agent:external.demo/agent/"
      scope: "agent"
    expected:
      valid: true

  - id: STATE-SNAPSHOT-01
    description: "SNAPSHOT returns entries as of a point in time"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.2.1"
    rtm_ids:
      - "STATE-§3.2.1-03"
    skip_until: "state-storage"
    # Requires: arsiactl server with state storage backend supporting
    # point-in-time snapshots. The SDK builds snapshot arguments but
    # the server maintains temporal state history.
    input:
      operation: snapshot
      as_of: "2026-04-13T12:00:00.000Z"
    expected:
      valid: true

  - id: STATE-DELETE-01
    description: "GET after DELETE returns null"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §3.1.3"
    rtm_ids:
      - "STATE-§3.1.3-05"
    skip_until: "state-storage"
    # Requires: arsiactl server with state storage backend.
    # The SDK builds delete/get payloads but does not store state.
    # This case tests that GET after DELETE returns null, which
    # requires a live state store.
    input:
      operation: delete_missing
      key: "agent:external.demo/agent/ghost"
    expected:
      result: null

  # ---- §1 Scope immutability — move = create + delete (P3.2) ----------

  - id: STATE-SCOPE-MOVE-01
    description: "scope mismatch between key and entry is rejected — scope change requires create+delete"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §1"
    rtm_ids:
      - "STATE-§1-03"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      entry:
        key: "agent:acme.alpha/agent/moved.data"
        value: {data: true}
        owner_agent_id: "agent:acme.alpha"
        scope: "shared"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "none"
        version: 1
    expected:
      valid: false
      error_contains: "scope"

  # ---- §1.1 Session timeout ≤ 24 hours (P3.2) -------------------------

  - id: STATE-SESSION-TIMEOUT-01
    description: "session entry with expires_at exceeding created_at + 24h is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §1.1"
    rtm_ids:
      - "STATE-§1.1-01"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      entry:
        key: "agent:acme.alpha/session/temp.data"
        value: {temp: true}
        owner_agent_id: "agent:acme.alpha"
        scope: "session"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        expires_at: "2026-04-14T13:00:00.000Z"
        pii_classification: "none"
        version: 1
    expected:
      valid: false
      error_contains: "exceeds created_at + 24h"

  # ---- §2.1.10 Pseudonymised entries comply with residency (P3.2) ------

  - id: STATE-PSEUDO-RESIDENCY-01
    description: "pseudonymised entry with data_residency mismatch is rejected"
    category: state
    level: compliance
    spec_ref: "ARSIA-State §2.1.10"
    rtm_ids:
      - "STATE-§2.1.10-03"
    input:
      operation: validate_state_entry
      sender_agent_id: "agent:acme.alpha"
      envelope_compliance:
        profile: "GDPR-STANDARD"
        data_residency: "DE"
      entry:
        key: "agent:acme.alpha/agent/pseudo.data"
        value: {hashed_id: "abc123"}
        owner_agent_id: "agent:acme.alpha"
        scope: "agent"
        created_at: "2026-04-13T12:00:00.000Z"
        updated_at: "2026-04-13T12:00:00.000Z"
        pii_classification: "pseudonymised"
        data_residency: "US"
        version: 1
    expected:
