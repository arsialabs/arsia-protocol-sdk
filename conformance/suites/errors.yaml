# SPDX-License-Identifier: BUSL-1.1
# Error code registry and retry policy — ARSIA-Core §11.2, §11.3.
# Hand-authored — language-agnostic.
name: errors
description: 'ARSIA error code registry and retry-delay calculation'
level: core
cases:

  # ---- Error registry — all 10 standard codes (§11.2) ---------------------

  - id: ERR-REG-INVALID-REQUEST
    description: "invalid_request → HTTP 400, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: invalid_request
    expected:
      http_status: 400
      retryable: false

  - id: ERR-REG-UNAUTHORIZED
    description: "unauthorized → HTTP 401, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: unauthorized
    expected:
      http_status: 401
      retryable: false

  - id: ERR-REG-FORBIDDEN
    description: "forbidden → HTTP 403, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: forbidden
    expected:
      http_status: 403
      retryable: false

  - id: ERR-REG-NOT-FOUND
    description: "not_found → HTTP 404, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: not_found
    expected:
      http_status: 404
      retryable: false

  - id: ERR-REG-CONFLICT
    description: "conflict → HTTP 409, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: conflict
    expected:
      http_status: 409
      retryable: false

  - id: ERR-REG-PAYLOAD-TOO-LARGE
    description: "payload_too_large → HTTP 413, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: payload_too_large
    expected:
      http_status: 413
      retryable: false

  - id: ERR-REG-RATE-LIMITED
    description: "rate_limited → HTTP 429, retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: rate_limited
    expected:
      http_status: 429
      retryable: true

  - id: ERR-REG-INTERNAL-ERROR
    description: "internal_error → HTTP 500, retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: internal_error
    expected:
      http_status: 500
      retryable: true

  - id: ERR-REG-NOT-IMPLEMENTED
    description: "not_implemented → HTTP 501, non-retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: not_implemented
    expected:
      http_status: 501
      retryable: false

  - id: ERR-REG-SERVICE-UNAVAILABLE
    description: "service_unavailable → HTTP 503, retryable"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: service_unavailable
    expected:
      http_status: 503
      retryable: true

  - id: ERR-REG-UNKNOWN-CODE
    description: "Unknown error code is rejected by get_error_info"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.2"
    input:
      operation: get_error_info
      code: not_a_real_code
    expected:
      raises: true

  # ---- Retry delay calculation (§11.3) -------------------------------------

  - id: ERR-RETRY-ATTEMPT-1
    description: "First retry delay is 1.0 seconds (base)"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.3"
    rtm_ids:
      - "CORE-§11.3-06"
    input:
      operation: calculate_retry_delay
      attempt: 1
    expected:
      delay_seconds: 1.0

  - id: ERR-RETRY-ATTEMPT-2
    description: "Second retry delay is 2.0 seconds (base * multiplier)"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.3"
    rtm_ids:
      - "CORE-§11.3-06"
    input:
      operation: calculate_retry_delay
      attempt: 2
    expected:
      delay_seconds: 2.0

  - id: ERR-RETRY-ATTEMPT-3
    description: "Third retry delay is 4.0 seconds (base * multiplier^2)"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.3"
    rtm_ids:
      - "CORE-§11.3-06"
    input:
      operation: calculate_retry_delay
      attempt: 3
    expected:
      delay_seconds: 4.0

  - id: ERR-RETRY-ATTEMPT-OUT-OF-RANGE
    description: "calculate_retry_delay raises for attempt > max_retries"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.3"
    rtm_ids:
      - "CORE-§11.3-08"
    input:
      operation: calculate_retry_delay
      attempt: 4
    expected:
      raises: true

  # ---- Error descriptions in English (§11.1) --------------------------------
  # NOTE: Programmatic verification of "written in English" is limited to
  # character encoding (ASCII-printable). Semantic English verification
  # requires human review. This test guards against non-Latin characters
  # being introduced in error descriptions.

  - id: ERR-DESCRIPTIONS-ENGLISH
    description: "All standard error descriptions are ASCII-printable English text"
    category: errors
    level: core
    spec_ref: "ARSIA-Core §11.1"
    rtm_ids:
      - "CORE-§11.1-08"
    input:
      operation: verify_descriptions_english
      codes:
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - payload_too_large
        - rate_limited
        - internal_error
        - not_implemented
        - service_unavailable
    expected:
      valid: true
