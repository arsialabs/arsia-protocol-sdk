[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arsia-conformance-runner"
version = "0.1.0"
description = "Language-agnostic conformance runner for the ARSIA Protocol SDK (Python harness)"
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
authors = [
  { name = "Arsia Labs", email = "hello@arsialabs.ai" },
]
dependencies = [
  "arsia-protocol",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
http = [
  "fastapi>=0.111",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "fastapi>=0.111",
  "httpx>=0.27",
]

[project.scripts]
arsia-conformance = "arsia_conformance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arsia_conformance"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
