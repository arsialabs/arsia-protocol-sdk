# OpenAI mode: the agents call OpenAI with your own API key, read from
# OPENAI_API_KEY (in the environment, or in this folder's .env). Use it with:
#
#   docker compose -f docker-compose.yml -f docker-compose.openai.yml up --build -d --wait
#
# Without OPENAI_API_KEY set, Compose stops before building or starting anything.
# The key is passed only to the agents that call the LLM; like any
# container setting, it is visible to `docker inspect` and
# `docker compose config` on this machine. DEMO_LLM_BASE_URL is for testing.
services:
  agent-a:
    environment: &llm-environment
      DEMO_LLM: openai
      DEMO_LLM_MODEL: ${DEMO_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY to your OpenAI API key}
      DEMO_LLM_BASE_URL: ${DEMO_LLM_BASE_URL:-}
  agent-b:
    environment: *llm-environment
  agent-c:
    environment: *llm-environment
